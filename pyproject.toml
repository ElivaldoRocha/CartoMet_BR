[project]
name = "cartomet-br"
version = "3.0.2"
description = "Cartografia Meteorológica para o Brasil — Análise sinótica interativa com dados ECMWF Open Data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Elivaldo C. Rocha", email = "carvalhovaldo09@gmail.com"}
]
keywords = [
    "meteorologia",
    "cartografia",
    "sinótica",
    "frentes",
    "ECMWF",
    "Brasil",
    "xarray",
    "cartopy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core científico
    "numpy>=2.0.0",
    "xarray>=2024.1.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    # Leitura de GRIB (ECMWF)
    "cfgrib>=0.9.14",
    "eccodes>=2.38.0",
    "ecmwf-opendata>=0.3.29", # 0.3.29 resolve scda→oper p/ 06Z/18Z (IFS 50r1)
    # Visualização
    "matplotlib>=3.9.0",
    # ≥0.24: FeatureArtist vira Collection — o realce de contornos
    # (set_linewidth/set_edgecolor in-place) depende disso
    "cartopy>=0.24.0",
    # GIF da animação de steps (já vinha como transitiva do matplotlib;
    # declarada porque animation_service.py a usa diretamente)
    "pillow>=10.4",
    # Processamento meteorológico (≥1.7: peak_persistence p/ ranking dos centros H/L)
    "metpy>=1.7.0",
    # Suavização robusta LOWESS (overlay de eixo da ZCIT — LOCZCIT-PA)
    "statsmodels>=0.14.0",
    # Radiossondagem vertical (Skew-T) — Universidade de Wyoming
    "siphon>=0.9",
    # Observações de superfície (SYNOP)
    "pymetdecoder>=0.1.5",
    "pyqt6>=6.10.2",
    "pyinstaller>=6.19.0",
    # Satélite GOES-16
    "netCDF4>=1.6.0",
    "requests>=2.31.0",
    "markdown>=3.5",
    "eccodeslib>=2.47.1.20 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.7.0",
]
build = [
    "pyinstaller>=6.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipython>=8.26.0",
    "jupyter>=1.0.0",
]
# Filtro de Coerência Espacial (LISA/Moran Local) — alternativa OPCIONAL ao IQR.
# Pesado e não-essencial: mantido fora da instalação base. `scipy` já é core.
spatial = [
    "esda>=2.5",
    "libpysal>=4.9",
]
# Exportação MP4 da animação de steps (GIF via Pillow é sempre disponível).
# ffmpeg embutido (~25-30 MB) fica FORA do instalador Windows — extra opcional.
animation = [
    "imageio-ffmpeg>=0.5.1",
]
# Reanálise ERA5 via API do CDS/Copernicus (validação científica; requer
# chave pessoal — menu Configurações → "Chave ERA5 (CDS)...").
reanalysis = [
    "cdsapi>=0.7.2",
]
all = [
    "cartomet-br[gui,build,dev,spatial,animation,reanalysis]",
]

[project.scripts]
cartomet-br = "cartomet_br.__main__:main"

[project.urls]
Homepage = "https://github.com/ElivaldoRocha/CartoMet_BR"
Documentation = "https://github.com/ElivaldoRocha/CartoMet_BR#readme"
Repository = "https://github.com/ElivaldoRocha/CartoMet_BR"
Issues = "https://github.com/ElivaldoRocha/CartoMet_BR/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartomet_br"]

[tool.uv]
# UV resolve e instala dependências automaticamente

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
# requests/markdown estão instalados mas sem stubs de tipo; "import-untyped" é
# ruído de "biblioteca sem py.typed", no mesmo espírito de ignore_missing_imports.
disable_error_code = ["import-untyped"]

# Camada de renderização Cartopy: os eixos são GeoAxes em runtime (com
# .add_feature/.set_extent/.gridlines), mas o stub do matplotlib tipa plt.axes()
# como Axes — gerando centenas de falsos "attr-defined". O Cartopy não publica
# stubs completos. Type-checagem fica restrita à camada de dados/lógica (valiosa
# e limpa); este glue de desenho é isento. Ver CHANGELOG v3.0.
[[tool.mypy.overrides]]
module = [
    "cartomet_br.gui.map_canvas",
    "cartomet_br.gui.main_window",
    "cartomet_br.charts.synoptic",
    "cartomet_br.charts.interactive",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cartomet_br --cov-report=term-missing"
