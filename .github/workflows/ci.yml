name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # Não-bloqueante: há dívida pré-existente de lint/format/mypy (o passo nunca
    # rodou enquanto o `uv sync --dev` não instalava as ferramentas). Mantido
    # visível como aviso; a limpeza será feita incrementalmente. Os Testes
    # permanecem bloqueantes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check cartomet_br/

      - name: Ruff format check
        run: uv run ruff format --check cartomet_br/

      - name: Mypy
        run: uv run mypy cartomet_br/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
