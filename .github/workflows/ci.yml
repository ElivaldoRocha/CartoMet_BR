name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      # Ruff é bloqueante: a dívida de lint foi limpa e agora protege o projeto.
      - name: Ruff check
        run: uv run ruff check cartomet_br/

      - name: Ruff format check
        run: uv run ruff format --check cartomet_br/

      # Mypy segue advisory (continue-on-error): há ~99 achados pré-existentes,
      # quase todos atrito de stubs do xarray/numpy (ex.: `.sel(**kwargs)`,
      # "Returning Any", overloads de datetime64) — não são bugs. Mantido visível
      # como aviso; será endereçado em etapa própria. Ruff e Testes bloqueiam.
      - name: Mypy
        continue-on-error: true
        run: uv run mypy cartomet_br/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      # O ubuntu-latest enxuto não traz as libs gráficas do Qt; sem elas o
      # `import PyQt6.QtWidgets` falha na coleta (ImportError: libEGL.so.1).
      # Conjunto completo conhecido para importar PyQt6 headless. Só no Linux.
      - name: Instala libs de sistema do Qt (Linux headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -v --tb=short
