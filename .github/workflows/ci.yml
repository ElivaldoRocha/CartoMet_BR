name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0  # setup-uv não publica major flutuante (@v8); tag exata

      - name: Install dependencies
        run: uv sync --extra dev

      # Ruff é bloqueante: a dívida de lint foi limpa e agora protege o projeto.
      # Escopo inclui tests/ (a dívida de estilo dos testes foi limpa na v3.1).
      - name: Ruff check
        run: uv run ruff check cartomet_br/ tests/

      - name: Ruff format check
        run: uv run ruff format --check cartomet_br/ tests/

      # Mypy é bloqueante: a dívida de tipos foi limpa na camada de dados/lógica.
      # O glue de renderização Cartopy (GeoAxes) é isento via [tool.mypy.overrides]
      # no pyproject — ali os "attr-defined" são atrito de stub, não bugs.
      - name: Mypy
        run: uv run mypy cartomet_br/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0  # setup-uv não publica major flutuante (@v8); tag exata

      - name: Install dependencies
        run: uv sync --extra dev

      # O ubuntu-latest enxuto não traz as libs gráficas do Qt; sem elas o
      # `import PyQt6.QtWidgets` falha na coleta (ImportError: libEGL.so.1).
      # Conjunto completo conhecido para importar PyQt6 headless. Só no Linux.
      - name: Instala libs de sistema do Qt (Linux headless)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -v --tb=short
